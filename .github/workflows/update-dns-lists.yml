name: Update DNS discovery lists

on:
  # 04:20 rather than the top of the hour: GitHub delays scheduled runs during
  # periods of high load and documents the start of every hour as one.
  #
  # Daily matches the record TTL. Leaf records are published with Cloudflare's
  # maximum TTL of one day, so a resolver serves a cached copy for that long
  # regardless -- publishing more often rewrites records nothing re-reads. The
  # root carries a 30 minute TTL and clients re-check it on the same interval,
  # so a new sequence number reaches a running node within the hour.
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Crawl and filter, but do not sign or publish'
        type: boolean
        default: false

permissions:
  contents: write
  # For the one status issue this workflow keeps: it is rewritten every run,
  # commented on when the state changes, and a bootnode's comment is deleted
  # when it answers again -- see scripts/report-status.sh.
  issues: write

concurrency:
  # Two crawls publishing to the same zone would race on the tree sequence
  # number. Never run this twice at once.
  group: dns-lists
  cancel-in-progress: false

jobs:
  update:
    # A fork of a public repository inherits its workflows. Without this guard a
    # fork would run the schedule against its own (absent) secrets, failing
    # nightly and forever.
    if: github.repository == 'ethereumclassic/discv4-dns-lists'
    # Pinned: a newer image is adopted by changing this line.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out core-geth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ethereumclassic/core-geth
          path: .core-geth
          # A moving branch, deliberately. This build produces the tool that
          # decides which nodes are published, and tracking main gives it every
          # fix and dependency bump the night it merges, rather than at the next
          # release. That relies on core-geth's main changing only through
          # reviewed pull requests. The crawl is also seeded from the bootnode
          # list in this checkout.
          #
          # main is core-geth's default branch.
          ref: main

      - name: Set up Go
        # This Go only compiles and runs core-geth's build script. go.mod's `go`
        # line is the minimum that can build core-geth, not the Go its releases
        # are built with; the next step builds devp2p with that one.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .core-geth/go.mod
          # setup-go caches by default, and its default lookup is root-only: it
          # reads GITHUB_WORKSPACE with readdirSync and tests that listing for
          # the literal name `go.mod` -- not a glob, and it does not descend.
          # Verified in dist/setup/index.js at the SHA pinned above, which is the
          # file the action actually runs.
          #
          # This repository has neither go.mod nor go.sum at its root; both live
          # in .core-geth, which the step above creates. So the default lookup
          # can never resolve here. The miss throws, but the caller catches it
          # and downgrades it to a warning -- it does NOT fail the run, it
          # silently disables the cache on a job that rebuilds a large Go client
          # every night. Naming the path restores it.
          #
          # go.sum rather than go.mod: it is what the build's module set is
          # actually resolved from, so it is the correct cache key.
          cache-dependency-path: .core-geth/go.sum

      - name: Build devp2p
        # Built the way core-geth builds its releases. `ci.go install -dlgo`
        # downloads the Go that core-geth's build/checksums.txt pins, checks it
        # against the SHA-256 that file lists, and compiles with it. So devp2p
        # gets the Go core-geth's main pins, and moves the night that pin does.
        # The check after the build refuses a binary compiled by any other Go.
        #
        # Upstream go-ethereum's devp2p has no "classic" or "mordor" value for
        # -eth-network. Its filter REJECTS an unknown network -- measured, exit 1
        # with `unknown network "classic"` -- so a build from the wrong source
        # fails the run loudly rather than publishing an empty tree.
        run: |
          cd .core-geth
          go run build/ci.go install -dlgo ./cmd/devp2p
          cp build/bin/devp2p "$GITHUB_WORKSPACE/devp2p"
          want="go$(awk '$2 == "version:golang" {print $3}' build/checksums.txt)"
          have=$(go version "$GITHUB_WORKSPACE/devp2p" | awk '{print $2}')
          echo "devp2p compiled with $have; build/checksums.txt pins $want"
          if [ "$have" != "$want" ]; then
            echo "::error::devp2p was compiled with $have, not the $want that core-geth pins."
            exit 1
          fi
          "$GITHUB_WORKSPACE/devp2p" --version || true

      - name: Write signing key
        if: ${{ !inputs.dry_run }}
        env:
          DNS_SIGNING_KEY: ${{ secrets.DNS_SIGNING_KEY }}
          DNS_SIGNING_KEY_PASSWORD: ${{ secrets.DNS_SIGNING_KEY_PASSWORD }}
        run: |
          # devp2p's `dns sign` loads an Ethereum keystore JSON and reads its
          # password from stdin. Both halves are required; a raw hex key fails
          # with "error decrypting key".
          if [ -z "$DNS_SIGNING_KEY" ] || [ -z "$DNS_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::DNS_SIGNING_KEY and DNS_SIGNING_KEY_PASSWORD must both be set. The tree cannot be signed."
            exit 1
          fi
          umask 077
          printf '%s' "$DNS_SIGNING_KEY"          > "$RUNNER_TEMP/dns-signing.json"
          printf '%s' "$DNS_SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/dns-signing.pass"

      - name: Crawl, filter, sign and publish
        env:
          DEVP2P: ${{ github.workspace }}/devp2p
          CORE_GETH_SRC: ${{ github.workspace }}/.core-geth
          DNS_SIGNING_KEY_FILE: ${{ runner.temp }}/dns-signing.json
          DNS_SIGNING_KEY_PASSWORD_FILE: ${{ runner.temp }}/dns-signing.pass
          # devp2p reads this as the EnvVar for its --token flag, so it is not
          # passed on the command line where it would land in /proc/<pid>/cmdline.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # All three domains are served from one Cloudflare account, which
          # devp2p publishes to natively, as it does to Route53; any other
          # provider goes through to-txt. This is not provider diversity: a
          # problem with the account takes all six trees offline at once. It
          # does not reach the bootnodes, which clients contact by IP address.
          DOMAINS: 'ethereumclassic.net:cloudflare ethclassic.net:cloudflare ethereumclassic.network:cloudflare'
          # Configuration, not secrets: a zone ID is visible in the provider
          # dashboard and grants nothing on its own. devp2p cannot derive them
          # -- see scripts/update-lists.sh.
          CLOUDFLARE_ZONE_IDS: >-
            ethereumclassic.net=bc79166f3eca64edddeec1b6e0e4489d
            ethclassic.net=b1a010358b1dbc6af14b6e880af34df8
            ethereumclassic.network=41313b1ad8c6c958fc54086b89d106aa
          # Whether each bootnode answered the crawl, for the status report.
          BOOTNODE_STATUS: ${{ runner.temp }}/bootnodes.json
        # The output is kept for the status report. pipefail, because a step's
        # default shell is `bash -e` without it, and `tee` would then turn a
        # refused run into a passing one.
        run: |
          set -o pipefail
          ./scripts/update-lists.sh ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee "$RUNNER_TEMP/update-lists.log"

      - name: Remove signing key
        # Runs even if the step above failed, so a crash does not leave the key
        # on the runner for the rest of the job.
        if: always()
        run: rm -f "$RUNNER_TEMP/dns-signing.json" "$RUNNER_TEMP/dns-signing.pass"

      - name: Commit the published trees
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Unquoted, so the shell expands these to real directory names
          # before git sees them.
          #
          # The earlier form, `git add 'all.*.ethereumclassic.net'`, staged
          # NOTHING: quoted, it reached git as a pathspec, and git matches
          # pathspecs against file paths -- no file ends in `.ethereumclassic.net`,
          # so it matched none, `git add` failed atomically (rc=128), and the
          # `|| true` after it swallowed the error. Measured, with the trailing-
          # glob form as the control, which does match and does stage.
          #
          # Either fix alone is sufficient -- unquoting, or moving the wildcard
          # to the end. Both are used here, and the `|| true` is gone so that a
          # staging failure is loud. .core-geth and the devp2p binary are
          # gitignored and cannot be caught by these patterns.
          git add all.json all.classic.* all.mordor.*

          if git diff --cached --quiet; then
            echo "No change in the published trees."
            exit 0
          fi

          # Node counts in the message, so a degraded publish is visible in
          # `git log` without diffing anything.
          counts=$(for d in all.classic.* all.mordor.*; do
                     [ -f "$d/nodes.json" ] || continue
                     printf '%s=%s ' "$d" "$(jq 'length' "$d/nodes.json")"
                   done)
          git commit \
            -m "lists: refresh from $(date -u +%Y-%m-%d) crawl -- ${counts%% }" \
            -m "Published by ${{ github.workflow }} run ${{ github.run_id }}."
          git push

      - name: Report status
        # Every run except a manual dry run, and whether or not an earlier step
        # failed: a refused or broken run is exactly what must not go unseen.
        if: ${{ always() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/report-status.sh "$JOB_STATUS" "$RUN_URL" "$RUNNER_TEMP/update-lists.log" "$RUNNER_TEMP/bootnodes.json"
